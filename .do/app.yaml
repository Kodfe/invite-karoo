# DigitalOcean App Platform spec: the API + Admin Dashboard (root Dockerfile) with a managed PostgreSQL.
# Create the database cluster "invite-karoo-db" first (Databases → Create → PostgreSQL, Bangalore),
# then either create the app in the control panel (see backend/README.md) or run:
#   doctl apps create --spec .do/app.yaml
# Values marked CHANGE_ME must be replaced (in the control panel they are stored encrypted).
name: invite-karoo
region: blr
services:
  - name: api
    github:
      repo: Kodfe/invite-karoo
      branch: main
      deploy_on_push: true
    source_dir: /
    dockerfile_path: Dockerfile
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /v1/config/health
      initial_delay_seconds: 30
    envs:
      - { key: DATABASE_URL, scope: RUN_TIME, value: "${db.DATABASE_URL}" }
      - { key: DATABASE_CA_CERT, scope: RUN_TIME, value: "${db.CA_CERT}" }
      - { key: PUBLIC_URL, scope: RUN_TIME, value: "${APP_URL}" }
      # testing: every number signs in with 1234. Switch to production + WhatsApp before going live.
      - { key: NODE_ENV, scope: RUN_TIME, value: development }
      - { key: DEV_OTP, scope: RUN_TIME, value: "1234" }
      - { key: JWT_ACCESS_SECRET, scope: RUN_TIME, type: SECRET, value: CHANGE_ME_long_random_1 }
      - { key: JWT_REFRESH_SECRET, scope: RUN_TIME, type: SECRET, value: CHANGE_ME_long_random_2 }
      - { key: JWT_ADMIN_SECRET, scope: RUN_TIME, type: SECRET, value: CHANGE_ME_long_random_3 }
      - { key: ADMIN_EMAIL, scope: RUN_TIME, value: CHANGE_ME@example.com }
      - { key: ADMIN_PASSWORD, scope: RUN_TIME, type: SECRET, value: CHANGE_ME_10plus_chars }
      - { key: TEAM_WHATSAPP, scope: RUN_TIME, value: "919000000000" }
databases:
  - name: db
    engine: PG
    production: true
    cluster_name: invite-karoo-db
