name: App

# Android APK on every push to main that touches the app.
# iOS → TestFlight when run by hand (Actions → App → Run workflow), or on every push
# once the repository variable IOS_ON_PUSH is set to "true".
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app.yml']
  workflow_dispatch:
    inputs:
      ios:
        description: 'Also build for iOS and upload to TestFlight'
        type: boolean
        default: true

permissions:
  contents: write   # only to save build logs on the ci-logs-* branches

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.8'
  # Build-time settings. Set them under Settings → Secrets and variables → Actions.
  API_URL: ${{ vars.API_URL }}
  FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
  FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
  FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}
  FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
  FIREBASE_IOS_APP_ID: ${{ vars.FIREBASE_IOS_APP_ID }}
  FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
  PRIVACY_URL: ${{ vars.PRIVACY_URL }}
  TERMS_URL: ${{ vars.TERMS_URL }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Create the Android and iOS folders
        run: |
          flutter create --org com.invitekaroo --project-name invite_karoo --platforms android,ios .
          rm -rf test
          python3 tool/prepare_platforms.py
          flutter pub get
          dart run flutter_launcher_icons

      - name: Check the code
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ../ci-analyze.txt

      - name: Release signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
            echo "Signing with the release key."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret — the APK is signed with a debug key (fine for testing, not for the Play Store)."
          fi

      - name: Build
        run: |
          DEFINES=()
          for k in API_URL FIREBASE_API_KEY FIREBASE_PROJECT_ID FIREBASE_SENDER_ID FIREBASE_ANDROID_APP_ID FIREBASE_IOS_APP_ID FIREBASE_STORAGE_BUCKET PRIVACY_URL TERMS_URL; do
            v="${!k}"; [ -n "$v" ] && DEFINES+=("--dart-define=$k=$v")
          done
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          DEFINES+=("--dart-define=APP_VERSION=$VERSION")
          if [ -z "$FIREBASE_API_KEY" ] || [ -z "$FIREBASE_ANDROID_APP_ID" ]; then echo "::warning::Firebase variables (FIREBASE_API_KEY, FIREBASE_PROJECT_ID, FIREBASE_SENDER_ID, FIREBASE_ANDROID_APP_ID) are not set: this APK opens but cannot sign in."; fi
          set -o pipefail
          flutter build apk --release --target-platform android-arm,android-arm64 --build-number=${{ github.run_number }} "${DEFINES[@]}" 2>&1 | tee ../ci-build.txt
          if [ -f android/key.properties ]; then flutter build appbundle --release --build-number=${{ github.run_number }} "${DEFINES[@]}" 2>&1 | tee -a ../ci-build.txt; fi
          cp build/app/outputs/flutter-apk/app-release.apk "build/invite-karoo-$VERSION-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: invite-karoo-android-${{ github.run_number }}
          path: |
            app/build/invite-karoo-*.apk
            app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Put the APK on the Releases page
        if: github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          {
            APK=$(ls app/build/invite-karoo-*.apk)
            # one release, updated in place: same link every time
            if ! gh release view android-latest > /dev/null 2>&1; then
              gh release create android-latest --prerelease --title "Android test build" \
                --notes "Latest Android test build. Open this page on the phone, tap the .apk file, and allow installing from this source when Android asks."
            fi
            for a in $(gh release view android-latest --json assets -q '.assets[].name'); do gh release delete-asset android-latest "$a" -y; done
            gh release upload android-latest "$APK" --clobber
            gh release edit android-latest --title "Android test build ${{ github.run_number }}" --target "${{ github.sha }}"
            echo "Published $APK"
          } 2>&1 | tee ci-release.txt

      - name: Save the logs for review
        if: always()
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/logs" && cp ci-*.txt "$RUNNER_TEMP/logs/" 2>/dev/null || true
          echo "run ${{ github.run_number }} · ${{ github.sha }} · ${{ job.status }}" > "$RUNNER_TEMP/logs/STATUS.txt"
          cd "$RUNNER_TEMP/logs" && git init -q -b logs && git config user.name ci && git config user.email ci@invitekaroo.local
          git add -A && git commit -qm "Build logs, run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" logs:ci-logs-${{ github.job }}

  ios:
    name: iOS → TestFlight
    if: (github.event_name == 'workflow_dispatch' && inputs.ios) || (github.event_name == 'push' && vars.IOS_ON_PUSH == 'true')
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the Apple secrets
        run: |
          missing=""
          for k in TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do [ -z "${!k}" ] && missing="$missing $k"; done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing. Add APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Create the iOS folder
        run: |
          flutter create --org com.invitekaroo --project-name invite_karoo --platforms android,ios .
          rm -rf test
          PUSH=""
          if [ -n "$FIREBASE_IOS_APP_ID" ] && [ "${{ vars.IOS_PUSH }}" = "true" ]; then PUSH="--push"; fi
          python3 tool/prepare_platforms.py $PUSH
          flutter pub get
          dart run flutter_launcher_icons

      - name: App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          KEY=~/private_keys/AuthKey_$ASC_KEY_ID.p8
          if echo "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then printf '%s\n' "$ASC_KEY_P8" > "$KEY"; else echo "$ASC_KEY_P8" | base64 --decode > "$KEY"; fi
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Prepare the Xcode project
        run: |
          DEFINES=()
          for k in API_URL FIREBASE_API_KEY FIREBASE_PROJECT_ID FIREBASE_SENDER_ID FIREBASE_ANDROID_APP_ID FIREBASE_IOS_APP_ID FIREBASE_STORAGE_BUCKET PRIVACY_URL TERMS_URL; do
            v="${!k}"; [ -n "$v" ] && DEFINES+=("--dart-define=$k=$v")
          done
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          DEFINES+=("--dart-define=APP_VERSION=$VERSION")
          set -o pipefail
          flutter build ios --release --config-only --no-codesign --build-number=${{ github.run_number }} "${DEFINES[@]}" 2>&1 | tee ../ci-ios-prepare.txt
          cd ios && pod install --repo-update 2>&1 | tee -a ../../ci-ios-prepare.txt

      - name: Archive
        run: |
          set -o pipefail
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            archive > ../../ci-ios-archive.txt 2>&1 || { grep -E "error:|warning: .*signing|Provisioning|BUILD FAILED" ../../ci-ios-archive.txt | head -80; tail -n 80 ../../ci-ios-archive.txt; exit 1; }
          tail -n 20 ../../ci-ios-archive.txt

      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee ../ci-ios-upload.txt
          echo "Uploaded build ${{ github.run_number }}. It appears in App Store Connect → TestFlight after Apple finishes processing (usually 10–30 minutes)."

      - name: Save the logs for review
        if: always()
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/logs" && cp ci-*.txt "$RUNNER_TEMP/logs/" 2>/dev/null || true
          echo "run ${{ github.run_number }} · ${{ github.sha }} · ${{ job.status }}" > "$RUNNER_TEMP/logs/STATUS.txt"
          cd "$RUNNER_TEMP/logs" && git init -q -b logs && git config user.name ci && git config user.email ci@invitekaroo.local
          git add -A && git commit -qm "Build logs, run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" logs:ci-logs-${{ github.job }}
