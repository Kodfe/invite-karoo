name: Backend

on:
  push:
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**']

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ik
          POSTGRES_PASSWORD: ik
          POSTGRES_DB: invitekaroo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ik" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://ik:ik@localhost:5432/invitekaroo_test
