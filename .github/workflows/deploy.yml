name: Deploy to Firebase

# API (Cloud Functions + Firestore rules/indexes + Storage rules) and the Admin Dashboard
# (Firebase Hosting). Runs on every push to main that touches them, or by hand.
#
# Needs (Settings → Secrets and variables → Actions):
#   variable  FIREBASE_PROJECT_ID
#   secret    FIREBASE_SERVICE_ACCOUNT   the JSON key of a deploy service account
#   secrets   OTP_SECRET, ADMIN_EMAIL, ADMIN_PASSWORD   (WHATSAPP_TOKEN, ANTHROPIC_API_KEY optional)
#   variables NEXT_PUBLIC_FIREBASE_API_KEY, NEXT_PUBLIC_FIREBASE_APP_ID (+ the optional ones below)
on:
  push:
    branches: [main]
    paths: ['functions/**', 'admin/**', 'firebase.json', 'firestore.*', 'storage.rules', 'hosting/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # skipped until the Firebase project is connected (variable FIREBASE_PROJECT_ID)
    if: vars.FIREBASE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Check settings
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          OTP: ${{ secrets.OTP_SECRET }}
        run: |
          missing=""
          [ -z "$PROJECT" ] && missing="$missing variable:FIREBASE_PROJECT_ID"
          [ -z "$SA" ] && missing="$missing secret:FIREBASE_SERVICE_ACCOUNT"
          [ -z "$OTP" ] && missing="$missing secret:OTP_SECRET"
          if [ -n "$missing" ]; then echo "::error::Missing:$missing (Settings → Secrets and variables → Actions)"; exit 1; fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Google credentials
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Build the API
        working-directory: functions
        run: |
          npm ci
          npm run build

      - name: API settings (functions/.env)
        working-directory: functions
        run: |
          {
            echo "NODE_ENV=${{ vars.API_NODE_ENV || 'production' }}"
            echo "DEV_OTP=${{ vars.DEV_OTP }}"
            echo "PUBLIC_URL=${{ vars.API_PUBLIC_URL || 'https://api.invitekaroo.com' }}"
            echo "CORS_ORIGINS=${{ vars.CORS_ORIGINS || 'https://admin.invitekaroo.com' }}"
            echo "STORAGE_DRIVER=firebase"
            echo "FIREBASE_STORAGE_BUCKET=${{ vars.FIREBASE_STORAGE_BUCKET }}"
            echo "WHATSAPP_PROVIDER=${{ vars.WHATSAPP_PROVIDER || 'console' }}"
            echo "WHATSAPP_PHONE_NUMBER_ID=${{ vars.WHATSAPP_PHONE_NUMBER_ID }}"
            echo "WA_TEMPLATE_LANG=${{ vars.WA_TEMPLATE_LANG || 'en' }}"
            echo "TEAM_WHATSAPP=${{ vars.TEAM_WHATSAPP }}"
          } > .env
          cat .env

      - name: Build the Admin Dashboard
        working-directory: admin
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.API_PUBLIC_URL || 'https://api.invitekaroo.com' }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || format('{0}.firebaseapp.com', vars.FIREBASE_PROJECT_ID) }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
        run: |
          if [ -z "$NEXT_PUBLIC_FIREBASE_API_KEY" ]; then echo "::warning::NEXT_PUBLIC_FIREBASE_API_KEY is not set: the dashboard cannot sign in until it is."; fi
          npm ci
          npm run build

      - name: Secrets for the API (Secret Manager)
        env:
          OTP_SECRET: ${{ secrets.OTP_SECRET }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          for k in OTP_SECRET WHATSAPP_TOKEN ANTHROPIC_API_KEY; do
            v="${!k}"; [ -z "$v" ] && v="unset"
            printf '%s' "$v" > "$RUNNER_TEMP/$k"
            npx --yes firebase-tools@latest functions:secrets:set "$k" --data-file "$RUNNER_TEMP/$k" --project "$PROJECT" --force --non-interactive > /dev/null
            rm "$RUNNER_TEMP/$k"
            echo "set $k"
          done

      - name: Hosting sites (api + admin)
        run: |
          for s in api admin; do
            site="${{ vars.HOSTING_SITE_PREFIX || vars.FIREBASE_PROJECT_ID }}-$s"
            npx --yes firebase-tools@latest hosting:sites:create "$site" --project "$PROJECT" --non-interactive 2>/dev/null || true
            npx --yes firebase-tools@latest target:apply hosting "$s" "$site" --project "$PROJECT"
          done

      - name: Deploy
        run: npx --yes firebase-tools@latest deploy --only functions,firestore,storage,hosting --project "$PROJECT" --force --non-interactive

      - name: First admin + gift categories
        working-directory: functions
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          OTP_SECRET: ${{ secrets.OTP_SECRET }}
          NODE_ENV: production
        run: node dist/db/seed-admin.js

      - name: Where it is
        run: |
          site="${{ vars.HOSTING_SITE_PREFIX || vars.FIREBASE_PROJECT_ID }}"
          echo "API:   https://$site-api.web.app   (custom domain: api.invitekaroo.com)"
          echo "Admin: https://$site-admin.web.app (custom domain: admin.invitekaroo.com)"
